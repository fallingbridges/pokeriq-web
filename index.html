 are coming for free. Very little to say, all of it good.","{handWords} sees a free flop. If it hits, wonderful. If it misses, it cost you nothing. That is the deal."]),C("limpbig",10,L("Don't just call with a big hand"),["You just called with {handWords}. That invites the whole table in cheaply against a hand that wanted them out, or paying.","{handWords} and you called instead of raising. Big hands want big pots and fewer people. Calling gets you the opposite of both.","Calling with {handWords} is like owning a sports car and pushing it to the shops. Raise. Build the pot while you are ahead.","Chip would have raised {handWords} without thinking. Calling lets five people see a flop cheaply, and one of them will hit something."]),C("limpbig.premium",30,e=>L("Don't just call with a big hand")(e)&&(e.handKind==="aces"||e.handKind==="kings"),["{handWords}, and you just called. The best hand at the table went in disguised as a hand that is not sure. Raise it.","You called with {handWords}. Chip has a rule about that hand: it does not tiptoe."]),C("limp",10,L("Just calling leaks chips"),["You called with {handWords} instead of raising. That is how you tell the table you would like to see a flop but would rather not commit to anything.","{handWords} is a raise-or-fold hand. Just calling gives the blinds a free look and hands the pressure to someone else.","Calling here means you can only win one way: by hitting the flop. Raising means you can also win when everyone folds. Two ways beats one.","Just calling with {handWords} is not a disaster. It is a slow drip. Enough slow drips and the stack is gone.","You limped in. Chip's rule: if the hand is worth calling with, it is usually worth raising with. If it is not, fold."]),C("limp.again",30,e=>L("Just calling leaks chips")(e)&&e.nth>=2,["That is the {nthWord} time tonight you have called in front of the raise instead of making it. Raise or fold. Pick one.","Another call where a raise belonged. The blinds are starting to think you are a charity."]),C("limpok",10,L("Acceptable, not ideal"),["Calling with {handWords} from {seat}. The hand likes a cheap flop with company, so this is okay. A raise would have given you a second way to win.","Just calling from a late seat with {handWords}. Fine. Not sharp, but fine.","{handWords} wants to see a cheap flop with lots of people in. You got that. Chip would still have raised, but Chip is fussy."]),C("softplay",10,L("Soft play"),["Calling with {handWords} from {seat}, with the whole table still to act. Someone will raise, and then you have paid for nothing.","{handWords} from an early seat, just called. You will be acting first all hand with a hand that needs help. Raise it or fold it.","A soft call from early. The hand is not bad. The seat is. Plenty of players behind you get to decide what this costs."]),C("limpjunk",10,L("Calling with junk"),["You called with {handWords}. That hand almost never hits a flop it is happy with. You paid to find that out.","{handWords} from {seat}, called. Chip's notes say: fold. Chip's notes have said that for a while.","Calling with {handWords} is money spent on a flop that will not like you. Save it for a hand with a future.","That is a hand people fold when they are not thinking about it. Try not thinking about it.",["Even from {seat}, {handWords} does not earn a call. Acting last helps good hands. It does not rescue bad ones.",e=>e.ip]]),C("limpjunk.again",30,e=>L("Calling with junk")(e)&&e.nth>=2,["Another call with a hand that should not be in the pot. The blinds thank you. Chip does not.","{nthWord} time tonight with junk in the pot. The flop is not going to start liking these hands."]),C("callpremium",10,L("Good, re-raising is better"),["Calling with {handWords} keeps it secret. Re-raising makes a bigger pot with the best hand and gets rid of the extras. Secrets are overrated.","{handWords} against a raise: you called. Not wrong. But re-raising builds a pot with the best hand, which is the whole business model.","Chip would have re-raised. Calling with {handWords} sets a trap, sure, but it also lets people in behind you, and one of them will hit."]),C("callpremium.aces",30,Fs("Good, re-raising is better","aces"),["Pocket aces, and you just called the raise. Chip understands the trap. Chip would still rather have a big pot with the best hand than a small pot with a secret.","Aces, called. Everyone who joins the pot now is a person who could outdraw you cheaply. Raise, and make it two of you."]),C("solidcall",10,L("Solid call"),["Calling the raise with {handWords}. A real hand, a fair price, and the flop can take it from here.","{handWords} against a raise wins about {equity} of the time. Calling keeps the raiser's weaker hands in. Good.","A raise came in, you called with {handWords}. Nothing flashy. Correct is rarely flashy.",["{villain} raised, you called with {handWords}. Let {villain} keep betting into a hand that is ahead of most of what {villain} raises with.",e=>!!e.villain]]),C("okip",10,L("Okay in position"),["Calling with {handWords} against a raise. It is close, but acting last on every street makes it work.","{handWords} against a raise is a coin flip. From {seat}, you get to see what they do before you decide. That is what tips it.","A borderline call, made from the right seat. You will see their move before you make yours on every street. Fine."]),C("marginaloop",10,L("Marginal out of position"),["Calling a raise with {handWords} from {seat}. You will be first to act on every street with a hand that is not sure what it is.","{handWords} against a raise, out of position. You are paying {toCall} to guess first for the rest of the hand. Folding was cheaper.","Calling here means playing a middling hand while acting first, against someone who showed strength. That is three things against you.",["{villain} raised and you called with {handWords} from an early seat. Every street, you act before {villain} and know less. Fold these.",e=>!!e.villain]]),C("hopeful.ok",10,e=>L("Hopeful call")(e)&&e.good,["Calling {toCall} with {handWords}. It needs to hit the flop hard, but the price is small enough to try.","{handWords} against a raise. This is a lottery ticket, and cheap tickets are fine. This one cost {toCall}.","A hopeful call, cheaply made. If the flop is kind you win a lot. If it is not, you lost {toCall}. Fair trade."]),C("hopeful.bad",10,e=>L("Hopeful call")(e)&&e.bad,["Calling {toCall} with {handWords}. It only wins if the flop is kind, and you paid a lot for the privilege of hoping.","You called hoping for a perfect flop. That happens about one time in eight. The other seven, this was {toCall} for nothing.","{handWords} is a hand you play for cheap. {toCall} is not cheap. Chip checked."]),C("chasejunk",10,L("Chasing with junk"),["Calling a raise with {handWords}. It wins about {equity} of the time and has no plan for the flop. The plan was the expensive part.","{handWords} against a raise, called. Chip checked twice. Still a fold.","You paid {toCall} to see a flop with {handWords}. Even when it hits, it usually hits second best.","Calling a raise with that hand is not chasing a draw. It is chasing a feeling.",["{villain} raised and you called with {handWords}. {villain} is happy. That is your first clue.",e=>!!e.villain]]),C("great3bet",10,L("Great re-raise"),["Re-raising with {handWords}. Bigger pot, fewer players, best hand. Three good things at once.","{handWords} and you re-raised. That is the hand doing its job: making people pay to find out if you are serious.","A raise came in and you raised it back with {handWords}. Correct, and slightly rude. Chip likes both.",["{villain} raised, you re-raised with {handWords}. Now {villain} has a decision, and most of the answers are bad for {villain}.",e=>!!e.villain]]),C("great3bet.aces",30,Fs("Great re-raise","aces"),["Pocket aces, re-raised. The best hand in the deck gets a bigger pot. As it should.","Aces, and you raised it back. If they fold, fine. If they call, better. If they re-raise again, Chip will be watching with a small smile."]),C("standard",10,L("Standard raise"),["{handWords} from {seat}, raised. The table has been informed. Correct.","Raising with {handWords}. Building a pot while ahead is the whole business model.","A raise with {handWords}. Nothing clever, nothing needed. Big hand, bigger pot.","You raised {handWords} and the blinds have a problem. Good. That is their problem."]),C("standard.aces",30,Fs("Standard raise","aces"),["Pocket aces, raised. You get them about once every 220 hands. Treat them well.","Aces. Raised. Chip has nothing to add and is slightly jealous."]),C("standard.kings",30,Fs("Standard raise","kings"),["Pocket kings, raised. Only one hand beats you right now, and it is not in most people's pockets.","Kings, raised. If an ace lands on the flop, Chip will help you grieve. Until then, enjoy it."]),C("standard.queens",30,Fs("Standard raise","queens"),["Pocket queens, raised. A great hand with a nervous disposition. Any ace or king on the flop and it starts sweating."]),C("standard.bigslick",30,Fs("Standard raise","bigslick"),["Ace-king, raised. It has not made a pair yet, but it is ahead of almost everything and it knows it.","Ace-king from {seat}, raised. Big cards, no pair, plenty of confidence. Correct."]),C("toomuch",10,L("Too much, too soon"),["{handWords} deserves a raise, not your whole stack. Going all-in only gets called by hands that beat you. Everything worse folds.","All-in with {handWords} before the flop. The hands that call are the ones you do not want to see. The ones you would love to see are folding.","You went all-in with a great hand. The problem: great hands want to be paid, and nobody pays a whole stack to a stranger.","Big hand, huge bet, small result. A normal raise keeps the weak hands in so they can pay you later."]),C("oddsize",10,L("Right idea, odd size"),["Raising {handWords} is right. The size is odd. Too big scares off the hands you want; too small lets everyone in. There is a middle.","Good hand, strange number. Raise sizes are like handshakes: firm, normal, forgettable. This one was memorable.","The raise was the right idea. The amount had Chip squinting. About three big blinds to open, about three times theirs to re-raise."]),C("ambitious",10,L("Ambitious re-raise"),["Re-raising with {handWords}. Bold. It turns a decent hand into a bluff. That can work, as long as you know that is what you did.","A re-raise with {handWords}. Fine occasionally. If they call, you are playing a big pot with a hand that is often second best.","You raised back with {handWords}. Chip's face did not move, but Chip's eyebrow did."]),C("goodraise",10,L("Good raise"),["Raising {handWords} from {seat}. You take charge of the hand and often just win the blinds. Good.","{handWords} from {seat}, raised. The raiser wins more often than the caller. Be the raiser.","A raise with {handWords}. If everyone folds, you win now. If someone calls, you have a real hand. Both fine.","Raise first, ask questions later. {handWords} from {seat} is exactly the hand for that."]),C("overkill",10,L("All-in is overkill"),["Going all-in with {handWords} to win the blinds. That is your whole stack risked for a few chips. Raise a normal amount instead.","All-in before the flop with {handWords}. If everyone folds you win a little. If someone calls you are usually behind. Bad trade.","That is a lot of chips to put in for the blinds. A raise to about three big blinds does the same job without the risk."]),C("steal",10,L("Steal attempt"),["Raising {handWords} from {seat} to take the blinds. Fine, in moderation, like most things at a poker table.","A raise with {handWords} from a late seat. You are not proud of the hand; you are proud of the seat. That is allowed.","Trying to steal the blinds with {handWords}. Works often enough. Just do not fall in love with the hand if someone calls."]),C("light3bet",10,L("A bluff re-raise"),["Re-raising with {handWords}. That is a bluff. It can work, but the hand wanted a cheap flop, and you just made it an expensive one.","You raised back with {handWords}. If they fold, lovely. If they call or raise again, you have a pretty hand and no plan.","A bluff re-raise with {handWords}. Bold. Chip would have called or folded and saved the drama for later."]),C("looseearly",10,L("Loose from early"),["Raising {handWords} from {seat}. There are a lot of players behind you, and they are not all asleep.","{handWords} from an early seat, raised. Someone behind you has a better hand more often than you would like. Save this for a later seat.","Nice hand for the button. You are not on the button. From {seat}, it is a fold."]),C("reckless",10,L("Reckless all-in"),["All-in with {handWords} before the flop. The only hands that call are the ones that crush you. That is a tidy definition of a bad all-in.","You shoved your stack with {handWords}. Chip put his coffee down.","All-in with {handWords}. If everyone folds, you win the blinds. If anyone calls, you are a big underdog. Small win, big loss. Bad bet.","Your entire stack, on a hand that hits a good flop about a third of the time. The other two thirds are expensive."]),C("puresteal",10,L("Pure steal"),["Raising {handWords} from {seat} to nick the blinds. It is junk, but the seat is good. Do it now and then, not every hand.","A raise with {handWords}. The hand is worthless, the position is not. Fine once in a while. The table notices after that.","Stealing with {handWords}. If anyone calls, remember you have nothing and act accordingly."]),C("spew",10,L("Throwing chips away"),["Raising {handWords} from {seat}. It wins about {equity} of the time and has no plan for the flop. The chips send their regards.","You raised with {handWords}. Lighting money on fire is at least warm. This is just expensive.","{handWords}, raised. Chip looked for the reason. Chip is still looking.","A raise with a hand that loses to nearly everything. If they fold, you got lucky. If they call, you did not."]),C("spew.facing",20,e=>L("Throwing chips away")(e)&&e.facing==="raise",["Raising into a raise with {handWords}. Someone already said they have something, and you said 'me too' with nothing.",["{villain} raised. You re-raised with {handWords}. {villain} has a hand. You have a story, and not a good one.",e=>!!e.villain]]),C("spew.allin",30,e=>L("Throwing chips away")(e)&&e.allIn,["All-in with {handWords}. Sometimes it works. Sometimes people jump off things and land fine. Chip recommends neither.","Your whole stack, with {handWords}. If this works, please do not learn anything from it."]),C("spew.again",30,e=>L("Throwing chips away")(e)&&e.nth>=2,["That is the {nthWord} raise tonight with a hand that should have been folded. The table has noticed. Chip has noticed harder.","Again, a raise with nothing. Bluffing before the flop works about as often as it did last time, which was not often."]),C("foldfree",10,L("Never fold for free"),["Nobody bet. You folded anyway. The next card was free and you paid for it by leaving.","You folded when you could have checked. That is not a decision, it is a donation with extra steps.","There was no bet. Check means you stay and see a free card. Fold means you leave. You left a free thing."]),C("foldfree.again",30,e=>L("Never fold for free")(e)&&e.nth>=2,["Again: no bet, no reason to fold. The check button is right there. Chip is pointing at it."]),C("ahead",10,L("You were ahead!"),["You folded {madeLower}. You were winning about {equity} of the time and only needed {potOdds} to call. That fold cost real money.","{made}, and you folded to a bet of {toCall}. You were ahead. Not a little ahead. Ahead.","Folding the best hand is the quietest way to lose. Your {madeBare} was good here more often than not.",["{villain} bet {toCall} and you folded {madeLower}. {villain} would have been delighted. Never delight {villain}.",e=>!!e.villain]]),C("tootight",10,L("Too tight"),["You had {equity} and only needed {potOdds}. Folding here is not a crime, merely a small unpaid invoice.","Folding {madeLower} to a bet of {toCall} into {pot}. The price was good and you had enough to call. Cautious is fine; this was past it.","You let go of a hand that was getting the right price. Nobody will notice except your chip stack, slowly.",["You folded {aDraw} getting a good price. Draws that are cheap to chase are meant to be chased. This one was.",e=>!!e.draw]]),C("closefold",10,L("Close spot"),["A close one: {equity} to win, {potOdds} needed. You took the cheap exit. Fine. Acting last, Chip might have lingered.","Folding {madeLower} was about as right as calling. Coin flips are allowed. Do not build a lifestyle on them.","Break-even spot, folded. Neither choice wins much here. You chose the one that cannot lose much either."]),C("discfold",10,L("Disciplined fold"),["{made}, facing a bet, released. Some hands are fine right up until someone bets at them.","You needed {potOdds} and had {equity}. Letting it go is the boring answer, and the right one.","Folding {madeLower} to a bet of {toCall}. Saved {toCall} chips. Saving chips counts the same as winning them. It just feels worse.","A bet came, the maths said no, you said no. Discipline photographs badly, but it pays."]),C("discfold.river",20,e=>L("Disciplined fold")(e)&&e.river,[["{villain} bet the river and you folded {madeLower}. Good. On the river there is nothing left to hope for, only what you have, and it was not enough.",e=>!!e.villain],"Folding on the river with {madeLower}. No more cards were coming to help. You looked at what you had and paid it the correct amount: nothing."]),C("discfold.draw",20,e=>L("Disciplined fold")(e)&&!!e.draw&&!e.river,["Folding {aDraw} to a bet of {toCall}. It was not cheap enough to chase. Well left; most players cannot.","{aDraw}, a big bet, a fold. Draws are only worth chasing at the right price. This was the wrong price."]),C("discfold.crowd",20,e=>L("Disciplined fold")(e)&&e.crowd,["Folding {madeLower} against {opp}. Someone in that crowd had you beaten. Not paying to find out which one is the skill."]),C("missedriver",10,L("Missed a river bet"),["{made} on the river and you checked. The river is your last chance to get paid. A bet earns chips; a check earns a thank-you card.","You checked {madeLower} on the last card. There is nobody left to trap. The only thing a check does now is keep the pot small.","The river is the last bus. It does not come back. {made} needed to be on it with a bet.","Checking a hand that strong on the river is like doing the work and forgetting to send the invoice."]),C("slow",10,L("Playing it slow"),["Checking {madeLower}. Traps are lovely in theory. In practice the pot stays small and the draws arrive for free.","{made} and you checked. Chip gets it. Chip also knows pots do not grow on their own.","You slowed down with a monster. Fine once, against one opponent, if you plan to bet later. Otherwise, just bet."]),C("slow.crowd",20,e=>L("Playing it slow")(e)&&e.opponents>=2,["Checking {madeLower} against {opp}. With that many people, someone has a draw and you just let them see the next card free. Bet.","A monster, several opponents, and a check. Chip counted the draws out there. Chip would like them to pay."]),C("slow.hu",20,e=>L("Playing it slow")(e)&&e.hu,["Against one opponent, a check with {madeLower} can work as a trap. The trap only pays if you spring it on the next street."]),C("leftbehind",10,L("Money left behind"),["{made} on the river, checked. That hand was probably best. Best hands get paid when they bet, and only then.","You checked the river with {madeLower}. Worse hands would have called a bet. Now they get to see for free. That is money left on the felt.","Last card, good hand, no bet. It is like walking out of a shop with your change still on the counter."]),C("betbetter",10,L("Okay, but bet is better"),["Checking {madeLower} is defensible. A bet of about two-thirds of the pot would have asked worse hands to pay, and some would.","You checked a hand that was probably best. Nothing lost yet, but money has a way of not waiting around.","{made} and a check. Not a mistake, exactly. More of a missed chance to charge the draws for the next card."]),C("potsmall",10,L("Keeping the pot small"),["A check with {madeLower}. Small hand, small pot, no drama. Correct.","Checking keeps the pot the size of your hand. Middling hands and big pots make poor company.","{made} is not strong enough to bet and too good to throw away. Checking is exactly the size of that hand.","You checked a middling hand. Chip nodded so slightly nobody saw it."]),C("sensible",10,L("Sensible check"),["Checking with {madeLower}. No reason to put chips in, every reason to see the next card free.","A check with not much. Nothing to protect, nothing to build. Wait and see what the deck does.","The next card is free. Your hand is weak. That is the easiest check in poker and you made it.",["Checking with {aDraw}. You get a free look at the next card, and if it comes you will have a hand. Very sensible.",e=>!!e.draw]]),C("stab",10,L("Fine — or take a stab"),["Checking is fine here. Against one opponent, acting last, a small bet often takes the pot without a fight. Either way.","You checked with nothing much. Fair enough. Chip might have bet small to see if they would give up. Chip is nosy.","A check with a weak hand, one opponent, and the last word. Correct. A small bet would also have been correct. Choose your adventure."]),C("monstercall",10,L("Playing a monster slow"),["Calling with {madeLower}. Keeps them in, sure. Raising builds a pot they are already willing to pay into.","{made} and you just called. That hand wants more money in the middle. Every street you do not raise is a street they do not pay.","You called with a monster. Chip understands the temptation. Chip also knows the chips do not move themselves."]),C("monstercall.river",20,e=>L("Playing a monster slow")(e)&&e.river,["Calling the river with {madeLower}? That was the last chance to get more. Raise it. Nobody folds a hand that already bet the river."]),C("profcall",10,L("Profitable call"),["You needed {potOdds} and you had {equity}. That is a call, not a hope.","Calling {toCall} into {pot} with {madeLower}. The price was right and the hand was real. Nothing more to say.","A bet came, you checked the price, the price was good, you called. That is the whole skill, done properly.",["{villain} bet {toCall}, you called with {madeLower}. Good price, real hand. {villain} can bet again if {villain} likes.",e=>!!e.villain]]),C("profcall.draw",20,e=>L("Profitable call")(e)&&!!e.draw&&!e.river,["Calling with {aDraw}. You hit often enough to justify {toCall}, and when you hit you get paid more. Good.","{aDraw}, a fair price, a call. This is what draws are for."]),C("profcall.combo",30,e=>L("Profitable call")(e)&&e.combo,["A flush draw and a straight draw at once, called. Lots of cards help you. This is the fun kind of call."]),C("margcall",10,L("Marginal call"),["Roughly break-even: {equity} against {potOdds} needed. Coin flips are allowed. Just do not build a lifestyle on them.","Calling {toCall} with {madeLower}. Close either way. When it is close, the next card decides it, and you are still in for that.","A borderline call. Nobody wins or loses much here over time. It is fine. It is the poker equivalent of a shrug."]),C("chase",10,L("Chasing"),["Chasing: {equity} to win, {potOdds} needed. The price did not match the hand, though Chip admires the optimism.","You paid {toCall} into {pot} with {madeLower}. That is too much for what the hand can do. The maths did not just disagree with you. It wrote a letter.","Calling with {equity} when you need {potOdds}. Every time you do this, a small amount of money leaves quietly.",["{villain} bet {toCall} and you paid it with {madeLower}. {villain}'s bet was a question. The answer was fold.",e=>!!e.villain]]),C("chase.river",20,e=>L("Chasing")(e)&&e.river,["Calling on the river with {madeLower}. No more cards are coming to rescue anyone. What you have is all you get, and it was not enough.","River call with {madeLower}. You were not chasing a card. You were chasing the pot, and the pot does not care."]),C("chase.draw",20,e=>L("Chasing")(e)&&!!e.draw&&!e.river,["Chasing {aDraw} for {toCall}. It gets there sometimes. Not often enough to pay that price.",["Calling {toCall} for a gutshot. Four cards in the deck help you. Four. Chip counted.",e=>e.drawKind==="gutshot"]]),C("chase.bad",20,e=>L("Chasing")(e)&&e.grade==="D",["Calling {toCall} with a hand that wins about {equity} of the time. Not close. Not even neighbours.","That call needed {potOdds} to make sense and you had {equity}. Chip is not angry. Chip is doing sums, sadly."]),C("chase.again",30,e=>L("Chasing")(e)&&e.nth>=3,["That is the {nthWord} time tonight you have paid too much to see the next card. The deck is not going to start being kinder.","Chasing again. Chip has started a tally. It is not a short tally."]),C("valuebet",10,e=>e.has("with the best hand"),["{made}, and you bet it. Bets with the best hand are the least glamorous way to win money, which is why they work.","Betting with the best hand. Revolutionary. Keep doing it until someone stops paying.","{made} and you put chips in. That is the entire point of having {madeLower}.","You bet a monster. The pot gets bigger, you are ahead, and somebody is about to pay for a card that does not come. Lovely."]),C("valuebet.river",20,e=>e.has("with the best hand")&&e.river,["A bet on the river with {madeLower}. Last chance to get paid, and you sent the invoice. Good."]),C("valuebet.raise",20,e=>e.is("Raise with the best hand"),["Raising with {madeLower}. Someone bet into the best hand and you made them pay for it. As it should be.",["{villain} bet, you raised with {madeLower}. {villain} now has to pay to keep going, and {villain} probably will.",e=>!!e.villain]]),C("goodvalue",10,e=>e.has("likely ahead"),["Betting {madeLower}. Probably the best hand, and the draws now have to pay to see the next card. Good.","A bet with {madeLower}. Worse hands call, draws pay a price, better hands are rare. That is a bet.","{made} and a bet. Not the best possible hand, just the best hand at the table most of the time. That is enough.",["Betting the river with {madeLower}. If they call with worse, you win more. If they fold, you were winning anyway. Fine.",e=>e.river]]),C("thincrowd",10,L("Thin against a crowd"),["A bet with {madeLower} into {opp}. Someone at this table has a better hand; the question is only who.","Betting a middling hand against {opp}. With that many people, someone usually has more than you. Checking was safer.","{made} against {opp}. A thin bet gets thinner with every extra pair of eyes."]),C("thinbet",10,L("A thin bet"),["A bet with {madeLower}. Thin, but against one opponent it earns its keep. Be prepared to fold if the reply is loud.","Betting {madeLower} against one opponent. It is often best, not always. If they raise, believe them.","A smallish hand, a bet, one opponent. Fine. You are betting to be called by worse, not to scare off better."]),C("semibluff",10,L("Bluff with a backup plan"),["Betting with {aDraw}. You can win now if they fold, or later if you hit. More ways to win than most bets get.","A bluff with a backup plan: {aDraw}. If they fold, lovely. If they call, you still have cards coming.","You bet a draw. Chip likes this. Aggression plus outs is the good kind of aggression.",["Betting a flush draw and a straight draw together. That is a bluff with two backup plans. Chip is fine with this.",e=>e.combo]]),C("boldbluff",10,L("Bluff — a bold one"),["A bluff with {madeLower}. It only works if they fold. One opponent, acting last: plausible. Just do not make it a habit.","You bet nothing much into one opponent. Sometimes they fold. Chip watched with interest.","A bluff, and a reasonable one. The story makes sense, there is only one person to convince, and you act last. That is the spot.",["A river bluff with {madeLower}. If it works, it was brave. If it does not, it was expensive. Only do it against someone who can fold.",e=>e.river]]),C("bluffoop",10,L("Bluffing out of position"),["Bluffing from out of position. You will act first on every street, which is a lot of first impressions to fake.","A bluff, acting first. If they call, you have to decide again on the next card with the same nothing. Bluffs from the back seat get called.","Betting {madeLower} first to act. The problem is not the bet. It is the next street, when they call and you have to do it again."]),C("bluffcrowd",10,L("Bluffing a crowd"),["A bluff into {opp}. One of them has something. That is simply how counting works.","Betting into a crowd with a {equity} chance of winning. Generous of you.","You tried to bluff {opp} at once. Bluffs work on one person. On three, someone always has a pair and a grudge.","Bluffing several players is like telling a lie to a room. Someone in the room was there."]),C("size.small",25,e=>e.post&&e.isRaise&&e.sizing==="small"&&!e.facingBet&&e.roll<.6,["You bet {amount} into a pot of {pot}. That is a tip, not a bet. The draws will happily pay it.","{amount} into {pot}. A bet that small does not ask anyone a question. Half to three-quarters of the pot does.","The hand was fine. The bet was tiny: {amount} into {pot}. Every draw at the table just got a discount."]),C("size.big",25,e=>e.post&&e.isRaise&&e.sizing==="big"&&!e.facingBet&&e.roll<.6,["A bet of {amount} into {pot}. Only hands that beat you are calling that. The worse hands you wanted have already left.","{amount} into a pot of {pot}. That is a lot. It folds out everything you beat and gets called by everything you do not."]),C("size.allin",25,e=>e.post&&e.isRaise&&e.sizing==="allin"&&e.roll<.7,["All-in, into a pot of {pot}. Big risk, small reward. A normal bet does the same job with less drama.","Your whole stack for a pot of {pot}. If they fold, you won a little. If they call, they had you. Chip did the sums; they are not kind."]),C("missed",12,e=>!!e.bestLine&&e.grade!=="A"&&e.roll<.4,["Chip would have {bestLineVerb}. What you did costs about {costChips} chips a time. Not a disaster. A slow leak.","The better play was to {bestLineTo}. Roughly {costChips} chips sat on the table and nobody picked them up.","The play was to {bestLineTo}. Yours works sometimes, which is the most expensive kind of wrong.","Chip's choice: {bestLineTo}. Yours was not terrible. It was about {costChips} chips worse, on average, every time.","Next time, {bestLineTo}. Chip has done the sums so you do not have to.","Different play, same cards: {bestLineTo}. Chip is not saying yours was wrong. Chip is saying it was worse. Slightly different.","Same spot, Chip would have {bestLineVerb}. The difference is small each time and large by the end of the night."]),C("textbook.blind",20,e=>L("Textbook fold")(e)&&(e.position==="SB"||e.position==="BB"),["{handWords} from the blind, folded. The blind is money you already lost. Do not throw more after it.","Folding {handWords} in the blind. You had money in already, which is exactly why people call with this. They are wrong. You were not.","The blind is a tax, not an investment. {handWords} folded, tax paid, moving on."]),C("textbook.facing",20,e=>L("Textbook fold")(e)&&e.facing==="raise",["Someone raised, and {handWords} was never going to argue. Folded. Good.",["{villain} raised. You had {handWords}. There is no version of this where you call. Well folded.",e=>!!e.villain],"A raise in front of you and junk in your hand. The easiest fold in poker, made without fuss."]),C("textbook.early",20,e=>L("Textbook fold")(e)&&(e.position==="UTG"||e.position==="MP"),["{handWords} from an early seat, folded. Five people still to act and a hand that beats nothing. Correct.","Folding {handWords} from {seat}. Early seat, weak hand. Chip would have folded it before it finished landing."]),C("sensible.overcards",20,e=>L("Sensible check")(e)&&e.classKind==="overcards",["Two big cards, no pair yet, and you checked. Free look at the next card. If it pairs you, wonderful. If not, you paid nothing to find out.","You checked with two overcards. No hand yet, but any ace or king changes that. Checking keeps the price of finding out at zero."]),C("sensible.lowpair",20,e=>L("Sensible check")(e)&&(e.classKind==="lowpair"||e.classKind==="secondpair"||e.classKind==="pocketbelow"),["A small pair and a check. It might be best, it might not, and betting would only find out the expensive way.","Checking with {madeLower}. A little pair is a hand you show down cheaply, not a hand you build a pot with."]),C("sensible.air",20,e=>L("Sensible check")(e)&&e.classKind==="air",["Nothing, and a check. Chip's favourite kind of nothing: the kind that costs nothing.","You have {madeLower}, which is a polite way of saying nothing. Checking is the only sensible thing to do with nothing.","No pair, no draw, no bet. Correct. Save the chips for a hand that has a pulse."]),C("sensible.river",20,e=>L("Sensible check")(e)&&e.river,["River, weak hand, check. If they bet, you fold. If they check, you might even win. Either way you spent nothing.","Checking the river with {madeLower}. There is no card left to hope for, so the only question is whether to bluff. Correct answer: no."]),C("sensible.crowd",20,e=>L("Sensible check")(e)&&e.crowd,["A check with {madeLower} against {opp}. Someone in that group has something. Let them do the betting."]),C("sensible.more",12,L("Sensible check"),["Check. Nothing to see here, which is the nicest thing you can say about a weak hand.","You tapped check with {madeLower}. The pot did not get bigger. Neither did your problem.","A weak hand, a free card, a check. Chip has run out of ways to say correct, so: correct.","Checked. If you had bet that, Chip would have asked what the plan was. There was no plan. Good check.","Nothing happened, and that was the right thing to happen."]),C("potsmall.class",20,e=>L("Keeping the pot small")(e)&&(e.classKind==="toppairweak"||e.classKind==="secondpair"),["Top pair with a weak second card, checked. It is probably ahead, and it does not want to find out for a lot of money. Just right.","You checked {madeLower}. A hand that wins small pots and loses big ones. You kept it in a small pot."]),C("potsmall.river",20,e=>L("Keeping the pot small")(e)&&e.river,["River check with {madeLower}. A bet would only get called by better. A check might win at showdown for free. Well judged.","You checked the river with a middling hand. Betting it would have been paying to lose more. Checking costs nothing and sometimes wins."]),C("potsmall.more",12,L("Keeping the pot small"),["Middling hand, checked. Chip has a whole speech about this. Short version: correct.","{made}, and no bet. The hand is not strong enough to want a big pot and not weak enough to give up. A check is exactly that.","Checked. A hand like {madeLower} makes money in small pots and loses it in big ones. Keep it small."]),C("profcall.river",20,e=>L("Profitable call")(e)&&e.river,["River call with {madeLower}. You win often enough to pay {toCall} for the pot of {pot}. That is the whole calculation, and it worked.","You called the river with {madeLower}. Sometimes you are shown a better hand. Often enough you are not, and the pot is {pot}. Good call."]),C("profcall.crowd",20,e=>L("Profitable call")(e)&&e.crowd,["Calling {toCall} with {opp} in the pot. More people means a bigger pot for the same price. Your hand liked the price. Good."]),C("profcall.more",12,L("Profitable call"),["Called. The price was {potOdds} and you had {equity}. Chip could put that on a poster.","A call, and a correct one. Not brave, not clever, just right. Right pays.","You paid {toCall} for a shot at {pot} with a hand that wins {equity} of the time. Do that all night."]),C("chase.more",12,L("Chasing"),["You called {toCall} with {madeLower}. Hope is not a hand. It is also not a draw.","Chasing. {equity} to win, {potOdds} to break even. The gap between those numbers is where your chips went.","That call was a small donation to whoever bet. They did not ask for it, but they will take it."]),C("bluffcrowd.allin",30,e=>L("Bluffing a crowd")(e)&&e.allIn,["All-in as a bluff into {opp}. Chip has watched this work exactly once, and the person who did it never played again.","Your whole stack, as a bluff, against {opp}. Somebody in that crowd has a hand and a call button."]),C("bluffcrowd.again",30,e=>L("Bluffing a crowd")(e)&&e.nth>=2,["Bluffing a crowd, {nthWord} time tonight. Still a crowd. Still someone with a hand. Still expensive."]),C("limpjunk.sb",20,e=>L("Calling with junk")(e)&&e.position==="SB",["From the small blind it is half price. Half price for {handWords} is still overpaying. And you act first for the rest of the hand.","Completing the small blind with {handWords}. It feels cheap. It is cheap. It is also a hand that never wins a big pot, only loses small ones."]),C("spew.first",30,e=>L("Throwing chips away")(e)&&e.first,["First hand of the night and you raised with {handWords}. Bold start. Chip prefers a dull start."]),C("spew.blind",20,e=>L("Throwing chips away")(e)&&(e.position==="SB"||e.position==="BB"),["Raising from the blind with {handWords}. You already had money in, so you put more in. That is not a reason. That is a habit.","{handWords} from the blind, raised. The blind is the worst seat at the table. You just volunteered to play a big pot from it with nothing."]),C("goodraise.more",12,L("Good raise"),["Raised. Everyone behind you now has to decide whether they want a fight. Most will not.","A raise with {handWords} from {seat}. Chip's notes say: yes.","You raised first. That is the seat of power in a poker hand. Sit in it as often as the cards allow."]),C("standard.more",12,L("Standard raise"),["Big hand, raised. Chip would have been worried if you had done anything else.","{handWords}, raised. The only question is how much you win, not whether you should have."]),C("ahead.more",12,L("You were ahead!"),["You folded the best hand. That is the one mistake in poker nobody sees, which is why it keeps happening.","Chip checked. You were winning. Then you folded. Chip is going to need a moment."]),C("discfold.more",12,L("Disciplined fold"),["Folded. The bet said 'I have it' and, for once, the numbers agreed. Well left.","You saved {toCall} chips by folding. That does not show up on the scoreboard. It shows up at the end of the month.","A fold with a hand that looked okay. Looked. The bet told you otherwise, and you listened."]),C("streak.good",15,e=>e.streakGood>=5&&e.good&&e.roll<.35,["{streakGood} good decisions in a row. Chip is not impressed. Chip is, however, quietly pleased.","That is {streakGood} in a row without a mistake. Do not get cocky. Actually, a little cocky is fine.","Another good one. {streakGood} straight. Poker is easy when you do this. Nobody does this."]),C("streak.bad",15,e=>e.streakBad>=3&&e.bad&&e.roll<.45,["{streakBad} shaky decisions in a row. Take a breath. The cards can wait, and so can Chip.","That is {streakBad} mistakes back to back. This is usually the point where a player starts playing the last hand instead of this one. Do not.","Three or more in a row now. Chip's advice: fold the next marginal hand and reset. The deck will still be there."]),C("name.good",12,e=>!!e.heroName&&e.good&&e.roll<.12,["Chip's notes on {heroName}, hand {handNumber}: correct, and quietly so.","{heroName}, that was fine. Chip says fine so rarely that you should frame it.","Good, {heroName}. Not exciting. Good. The two are rarely the same thing in this game."]),C("name.bad",12,e=>!!e.heroName&&e.bad&&e.roll<.12,["{heroName}. A word. That was not it.","Chip's notes on {heroName}, hand {handNumber}: a small mistake, the kind that adds up. Let us not add it up."]),C("bigpot.good",20,e=>e.bigPot&&e.grade==="A"&&e.roll<.5,["A pot of {pot} and you got it right. Big pots are where sessions are decided, and you decided this one well.","{pot} in the middle and a correct decision. Anyone can play small pots well. This is the one that mattered."]),C("bigpot.bad",20,e=>e.bigPot&&e.grade==="D"&&e.roll<.6,["A pot of {pot} and a mistake in it. Big pots are where sessions are decided. Decide them more carefully.","{pot} chips on the line and that was the play you chose. Small mistakes in small pots are cheap. This was neither."]),C("first.good",15,e=>e.first&&e.good&&!e.is("Textbook fold")&&e.roll<.5,["First hand, and a sensible decision. Chip is cautiously optimistic, which for Chip is practically giddy."]),C("first.bad",15,e=>e.first&&e.bad&&e.roll<.6,["First hand of the night and already a note from Chip. Do not worry. Everyone gets one. Most people get several."]),C("river.bad",8,e=>e.river&&e.bad&&e.roll<.3,["River decisions are the expensive ones. There are no more cards coming, only what you have and what they have. That one was costly.","The river is where the money changes hands, and where mistakes are dearest. That was one."]),C("fb.A.fold",2,e=>e.grade==="A"&&e.action==="fold",["A fold, and the right one. Your chips stay where they are, which is the point.","Well folded. Poker rewards the people who leave the pot at the right time."]),C("fb.A.check",2,e=>e.grade==="A"&&e.action==="check",["A check, correctly. Sometimes the best move is the one that costs nothing.","Checked. Right call. The next card is free and your hand did not want to pay anyway."]),C("fb.A.call",2,e=>e.grade==="A"&&e.action==="call",["A call at a fair price with a real hand. Chip approves, quietly.","Called. Good. The price was right and you noticed."]),C("fb.A.bet",2,e=>e.grade==="A"&&e.isRaise,["Chips in with the better hand. That is where the money comes from.","A bet at the right time. The pot grows, and you are the one it grows for."]),C("fb.B.fold",2,e=>e.grade==="B"&&e.action==="fold",["Folding here is fine. Not a mistake, not a lesson either. The poker equivalent of a polite nod.","A close fold. Chip would have understood the other choice too. No harm done."]),C("fb.B.check",2,e=>e.grade==="B"&&e.action==="check",["A check. Defensible. A bet might have earned a little more, but nothing was lost.","Checked. Fine. Chip might have bet, but Chip bets a lot."]),C("fb.B.call",2,e=>e.grade==="B"&&e.action==="call",["A call that works, though a raise would have asked a harder question.","Called. Reasonable. Not the sharpest option, but a long way from the dullest."]),C("fb.B.bet",2,e=>e.grade==="B"&&e.isRaise,["A bet with some risk in it. It can work. Just be ready if the reply is loud.","Chips in, with a plan that mostly holds up. Mostly is fine."]),C("fb.C.fold",2,e=>e.grade==="C"&&e.action==="fold",["Folding here leaves a little money behind. Not a crime. A small unpaid invoice.","A fold with something still to play for. Cautious is good; this was a notch past it."]),C("fb.C.check",2,e=>e.grade==="C"&&e.action==="check",["You checked with a hand that wanted to bet. The pot stays small. Your hand deserved bigger.","A check where a bet belonged. The money did not go anywhere yet. It just did not come to you."]),C("fb.C.call",2,e=>e.grade==="C"&&e.action==="call",["A call that the numbers did not quite support. Chip admires the optimism.","Called, at a price a bit steeper than the hand deserved."]),C("fb.C.bet",2,e=>e.grade==="C"&&e.isRaise,["Chips in with a hand that was not sure it wanted to be there. Bravery is not a hand ranking.","A bet with more hope than hand in it."]),C("fb.D.fold",2,e=>e.grade==="D"&&e.action==="fold",["You folded a hand that wanted to keep playing. That one hurt your stack more than it looked.","A fold you did not need to make. The chips send their regards."]),C("fb.D.check",2,e=>e.grade==="D"&&e.action==="check",["A check with a hand that needed to bet. The pot stayed small and so did your win.","You checked when the hand was begging for a bet."]),C("fb.D.call",2,e=>e.grade==="D"&&e.action==="call",["A call the maths did not just disagree with. It wrote a letter.","Called, at a price that made no sense. Every one of these costs money, quietly."]),C("fb.D.bet",2,e=>e.grade==="D"&&e.isRaise,["Chips in with a hand that did not deserve them. Generous of you.","A bet with nothing behind it and several people in front of it."]),C("fb.any",1,()=>!0,["{verdict}. Noted.","Chip has written that down. Neatly."])],ne=e=>t=>t.result===e,Su=[C("wu.pre",20,e=>ne("won_uncontested")(e)&&e.endedOn==="preflop",["Everyone folded before the flop. {pot} chips for doing nothing but raising. The blinds are how poker pays rent.","A raise, a table full of folds, {pot} chips. Nobody saw a flop. Nobody needed to.","You raised and everyone remembered other commitments. {pot}, no showdown, on to the next.","The blinds are yours. It is not much. It is also not nothing, and over a night it adds up to quite a lot of nothing."]),C("wu.big",30,e=>ne("won_uncontested")(e)&&e.bigPot,["Everyone folded to you in a pot of {pot}. That is a big pot to win without showing a card. Somebody at the table is muttering.","{pot} chips and nobody wanted to see your cards. Whether you had it is between you and Chip, and Chip is not telling."]),C("wu.allin",30,e=>ne("won_uncontested")(e)&&e.action==="all-in",["You went all-in and everyone ran. {pot} chips. It worked. Chip still wants a word about the size.","All-in, and the table folded in unison. {pot} chips. Chip is glad. Chip is also nervous about next time."]),C("wu",10,ne("won_uncontested"),["You bet, they folded, {pot} chips wandered over. Pressure is a hand too.","No showdown required. The table looked at your bet and collectively decided against it. Take the {pot}.","Everyone gave up. {pot} chips, no cards shown. The cheapest kind of win and the most underrated.","Nobody called. That is the poker version of a standing ovation: {pot} chips and silence.","They folded. All of them. {pot} chips for a bet and a straight face."]),C("ws.river",30,e=>ne("won_showdown")(e)&&e.riverHit,["The river rescued you. {heroHand} arrived on the last card and took {pot}. Enjoy it. Do not expect it. The river owes you nothing.","Last card, best hand. {heroHand} on the river for {pot} chips. Chip is happy for you and slightly worried about what you learned.","You got there on the river. {pot} chips with {heroHand}. Lucky is a fine thing to be. It is a terrible thing to plan on."]),C("ws.turn",30,e=>ne("won_showdown")(e)&&e.turnHit,["The turn came to your aid. {heroHand} took {pot}. Sometimes the deck is kind; note how it felt, it will not last."]),C("ws.doubled",30,e=>ne("won_showdown")(e)&&e.doubled,["You doubled up. {pot} chips with {heroHand}. Big pots happen when big hands meet stubborn ones. Today you were the big hand.","Double up. {heroHand}, {pot} chips, and a stack that suddenly looks like it means business."]),C("ws.busted.opp",20,e=>ne("won_showdown")(e)&&e.bigPot,["{pot} chips with {heroHand}. That is a real pot. That is a pot people remember on the drive home.","A big one: {pot} chips, {heroHand}. Chip would like you to notice that you won it with a real hand, not a wish."]),C("ws.highcard",20,e=>ne("won_showdown")(e)&&e.heroCat===0,["You won at showdown with {heroHand}. Nobody had anything. Poker is occasionally just a staring contest, and you did not blink.","{heroHand} wins {pot}. No pair, no draw, no problem. Everyone else had even less, which is the funniest way to win."]),C("ws.pair",20,e=>ne("won_showdown")(e)&&e.heroCat===1,["{heroHand} holds up for {pot}. One pair wins more pots than anything else in poker. It is not glamorous. It is rent.","A pair was enough. {pot} chips. Most of poker is one pair against another pair and the better one buying dinner."]),C("ws.twopair",20,e=>ne("won_showdown")(e)&&e.heroCat===2,["{heroHand} takes it. Two pair looks strong, usually is strong, and occasionally meets a bigger one. Not today.","Two pair, {pot} chips. A good hand that wins a lot and loses expensively. This was one of the wins."]),C("ws.trips",20,e=>ne("won_showdown")(e)&&e.heroCat===3,["Three of a kind, {pot} chips. Hands like this are how you pay for the ones that do not work out.","{heroHand}. Hidden, strong, paid. That is the dream, and it just came true for {pot}."]),C("ws.straight",20,e=>ne("won_showdown")(e)&&e.heroCat===4,["{heroHand}, and it held. Five cards in a row, all pointing at your stack. {pot} chips."]),C("ws.flush",20,e=>ne("won_showdown")(e)&&e.heroCat===5,["{heroHand} takes {pot}. Five of a suit is a lovely thing to turn over. Try not to look smug. Fail."]),C("ws.fullhouse",20,e=>ne("won_showdown")(e)&&e.heroCat===6,["{heroHand}. A full house. {pot} chips. Chip allows a small nod here.","A full house for {pot}. The kind of hand where you can hear the other player's stomach drop."]),C("ws.monster",20,e=>ne("won_showdown")(e)&&e.heroCat>=7,["{heroHand}. Chip has seen maybe a dozen of those. Enjoy the {pot}, and know it is mostly downhill from here."]),C("ws",10,ne("won_showdown"),["{heroHand} holds up for a pot of {pot}. Sometimes the cards cooperate. Note how it felt; it will not last.","You showed {heroHand} and it was, for once, enough. Enjoy the {pot}. The deck has no memory, so neither should you.","Showdown, {heroHand}, {pot} chips. It is nice when the best hand also wins. That is not a rule. It is a treat.","{pot} chips with {heroHand}. Won fairly, at showdown, with cards. The old-fashioned way."]),C("ls.busted",30,e=>ne("lost_showdown")(e)&&e.busted,["{winner} takes the last of it with {winnerHand}. That is the stack. Chip's note for next time: fewer big pots with middling hands.","And that is the stack, to {winner} with {winnerHand}. Chips come back. Habits are the thing to fix."]),C("ls.cooler",30,e=>ne("lost_showdown")(e)&&e.cooler,["{winnerHand} against your {heroHandBare}. There was no getting away from that one. Chip would not have either. Some hands are just expensive to be dealt.","You had {heroHand}. {winner} had {winnerHand}. Two big hands, one pot, no mistake. Poker does this occasionally to keep everyone humble."]),C("ls.rivered",30,e=>ne("lost_showdown")(
